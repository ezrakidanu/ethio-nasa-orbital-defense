name: Build offline Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_apk_release:
        description: Create a public GitHub Release with the built APK attached
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ethio-nasa-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify, bundle offline game and sync Capacitor
        run: pnpm typecheck && pnpm test && pnpm build && pnpm exec cap sync android
        env:
          SKIP_MANUS_ASSET_RESTORE: '1'
      - name: Assemble debug APK
        run: cd android && ./gradlew --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ethio-nasa-orbital-defense-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK as a GitHub Release asset
        if: github.event_name == 'workflow_dispatch' && inputs.publish_apk_release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: android/app/build/outputs/apk/debug/app-debug.apk
          RELEASE_TAG: android-build-${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" "$APK_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --title "ETHIO-NASA Android APK — build $GITHUB_RUN_NUMBER" \
            --notes "Debug APK built from commit $GITHUB_SHA by GitHub Actions. Install only on Android devices where installing APK files from outside Google Play is allowed."

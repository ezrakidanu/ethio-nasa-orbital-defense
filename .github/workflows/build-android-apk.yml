name: Build Android debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    name: Assemble native debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web dependencies and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Prepare downloadable APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ethio-nasa-orbital-defense-debug.apk

      - name: Verify APK artifact
        run: |
          test -s ethio-nasa-orbital-defense-debug.apk
          file ethio-nasa-orbital-defense-debug.apk
          sha256sum ethio-nasa-orbital-defense-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ethio-nasa-orbital-defense-debug-apk
          path: ethio-nasa-orbital-defense-debug.apk
          if-no-files-found: error
          retention-days: 30
